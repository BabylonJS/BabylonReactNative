name: 'build Typescript'

on:
  workflow_call
jobs:
  Build:
    runs-on: macos-15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2
      - name: Setup CMake
        # CMake 4.5 rejects the stray argument in Babylon Native's Polyfills/Canvas source_group() calls.
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.4.5'

      - name: NPM Install
        run: npm install
        working-directory: ./Package
      - name: NPM Install (Modules)
        run: |
          export BABYLON_NO_CMAKE_POSTINSTALL=1
          npm install
        working-directory: ./Modules/@babylonjs/react-native
      - name: NPM Install (Playground)
        run: |
          export BABYLON_NO_CMAKE_POSTINSTALL=1
          npm install
        working-directory: ./Apps/Playground
      - name: Gulp
        run: npx gulp buildAssembled
        working-directory: ./Package
      - name: Upload Assembled Folder
        uses: actions/upload-artifact@v4
        with:
          name: 'Assembled'
          path: Package/Assembled
