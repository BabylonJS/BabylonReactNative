name: 'build android'
on:
  workflow_call

jobs:
  build-android:
    runs-on: macos-15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2
      - name: Setup CMake
        # CMake 4.5 rejects the stray argument in Babylon Native's Polyfills/Canvas source_group() calls.
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.4.5'
      - name: Setting up developer environment
        run: node setup_dev.js
        working-directory: ./Package

      - name: List installed packages
        run: npm ls
        working-directory: ./Apps/Playground

      - name: Gulp (Android)
        run: npx gulp buildAndroid
        working-directory: ./Package
  