name: 'build test windows'

on:
  workflow_call:
    inputs:
      WindowsTargetPlatformVersion:
        description: 'Windows Target Platform Version'
        type: string
        default: '10.0.22621.0'
        required: false

jobs:
  build-test-windows:
    runs-on: windows-2022
    steps:
      - name: Support longpaths
        run: git config --system core.longpaths true

      - name: Checkout Repo
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: BabylonReactNative
          path: ./artifact

      - name: Install packaged sources
        shell: pwsh
        run: |
          Copy-Item package-windows.json package.json -Force
          Copy-Item package-lock-windows.json package-lock.json -Force
          $package = Get-ChildItem ../../artifact/babylonjs-react-native-*.tgz -File | Select-Object -First 1
          if (-not $package) {
            throw "BabylonReactNative package artifact was not found."
          }
          npm ci
          npm install --no-save --package-lock=false $package.FullName
        working-directory: ./Apps/Playground

      - name: Generate Windows project
        run: node generate-windows-test-app.mjs
        working-directory: ./Apps/Playground

      - name: Build packaged sources
        shell: pwsh
        run: |
          $project = Resolve-Path ..\node_modules\@babylonjs\react-native\windows\BabylonReactNative\BabylonReactNative.vcxproj
          $solutionPath = (Resolve-Path Playground.sln).Path
          $solutionDir = Split-Path $solutionPath
          $solutionFileName = Split-Path $solutionPath -Leaf
          MSBuild $project /restore /m /p:Platform=x64 /p:Configuration=Release /p:SolutionPath=$solutionPath /p:SolutionDir=$solutionDir /p:SolutionFileName=$solutionFileName /p:WindowsTargetPlatformVersion=${{ inputs.WindowsTargetPlatformVersion }} /p:UseExperimentalNuget=true /p:WindowsAppSDKVerifyTransitiveDependencies=false /v:minimal
        working-directory: ./Apps/Playground/windows

      - name: Build packaged Windows consumer
        shell: pwsh
        run: |
          $solutionPath = (Resolve-Path Playground.sln).Path
          MSBuild $solutionPath /restore /m /p:Platform=x64 /p:Configuration=Release /p:LanguageStandard=stdcpp20 /p:WindowsTargetPlatformVersion=${{ inputs.WindowsTargetPlatformVersion }} /p:UseExperimentalNuget=true /p:WindowsAppSDKVerifyTransitiveDependencies=false /v:minimal
        working-directory: ./Apps/Playground/windows
